name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # same image + credentials as docker-compose.yml; tests create their own catalist_test DB
      db:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: catalist
          POSTGRES_PASSWORD: catalist
        options: >-
          --health-cmd "pg_isready -U catalist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
        ports:
          - 5432:5432
    steps:
      # Actions pinned to commit SHAs: a tag can be moved to malicious code, a SHA cannot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5" # same uv as local
          enable-cache: true

      - run: uv sync --locked # fails if uv.lock is out of date with pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
